>Hard · imagineLong (cost 33)</text><text x="26" y="323" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif">Imagine a segment at B3–C3: then B3 must use B3–B4; then the</text><text x="26" y="340" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif">black circle at C4 cannot enter B4 and goes two cells right;</text><text x="26" y="357" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif">then the white circle at D5 must go horizontally; and finally</text><text x="26" y="374" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif">the black circle at C4 has no room for two straight segments.</text><text x="26" y="391" fill="#ffffff" font-size="13" font-family="system-ui, sans-serif">So cross out B3–C3.</text><text x="26" y="411" fill="#cccccc" font-size="11.5" font-family="system-ui, sans-serif">Move: cross out B3–C3.</text></svg>
